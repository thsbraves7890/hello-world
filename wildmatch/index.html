<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WildMatch Arena</title><style>body{margin:0;font-family:system-ui;background:#07110d;color:#f2f6f3}.app{max-width:1100px;margin:auto;padding:16px}h1{margin:4px 0 16px;font-size:clamp(28px,6vw,48px)}h1 span{color:#d8f76f}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px}.panel{background:#102219;border:1px solid #294535;border-radius:20px;overflow:hidden}.controls{padding:16px;display:grid;gap:12px}label{font-size:12px;color:#9db0a4}select,input,button{width:100%;padding:12px;border-radius:12px;border:1px solid #294535;background:#09150f;color:#fff;font:inherit}button{font-weight:800;cursor:pointer}.go{background:#d8f76f;color:#132007;border:0}.arena{height:520px;position:relative;overflow:hidden;background:linear-gradient(#244b36 0 62%,#6b5b39 62%)}.arena.snow{background:linear-gradient(#8babb6 0 60%,#dbe8e9 60%)}.arena.desert{background:linear-gradient(#be874a 0 58%,#d7b16c 58%)}.arena.rocky{background:linear-gradient(#58606a 0 58%,#777067 58%)}.sprite{position:absolute;font-size:42px;transition:.1s}.hero{font-size:78px}.hud{position:absolute;top:10px;left:10px;right:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:10}.card{background:#07110dcc;padding:9px;border-radius:10px}.bar{height:7px;background:#223229;border-radius:10px;overflow:hidden}.fill{height:100%;background:#d8f76f}.fill.e{background:#6fc8ff}.comment{position:absolute;left:12px;right:12px;bottom:12px;background:#07110ddd;padding:10px;border-radius:12px;z-index:11}.result{padding:16px;border-top:1px solid #294535}.muted{color:#9db0a4;font-size:12px}@media(max-width:780px){.grid{grid-template-columns:1fr}.arena{height:460px}.controls{order:2}}</style></head><body><div class="app"><h1>WildMatch <span>Arena</span></h1><div class="grid"><div class="panel controls"><div><b>Build a matchup</b><div class="muted">Pick a champion, a pack, and watch a randomized non-graphic battle.</div></div><label>Champion<select id="hero"></select></label><label>Pack / swarm<select id="enemy"></select></label><label>Number attacking<input id="count" type="number" min="1" max="1000" value="80"></label><label>Terrain<select id="terrain"><option>forest</option><option>rocky</option><option>snow</option><option>desert</option></select></label><label>Coordination <span id="cv">55%</span><input id="coord" type="range" min="10" max="100" value="55"></label><label>Chaos <span id="xv">35%</span><input id="chaos" type="range" min="0" max="100" value="35"></label><button class="go" id="fight">▶ Fight!</button><button id="estimate">Estimate # Needed</button><button id="reset">Reset</button><div class="muted">Entertainment-grade model only. Never test animal fights in real life.</div></div><div class="panel"><div id="arena" class="arena"><div class="hud"><div class="card"><b id="hn">Champion</b><div class="bar"><div id="hh" class="fill"></div></div></div><div class="card"><b id="en">Pack</b><div class="bar"><div id="eh" class="fill e"></div></div></div></div><div id="comment" class="comment">Choose a matchup and hit Fight.</div></div><div class="result"><h2 id="title">Ready?</h2><div id="text" class="muted">Try Grizzly Bear vs House Cats.</div></div></div></div></div><script>const A={grizzly:['Grizzly Bear','🐻',270,94,92,55,82,10],polar:['Polar Bear','🐻‍❄️',420,98,94,50,84,8],lion:['Lion','🦁',190,89,76,80,68,65],tiger:['Tiger','🐯',220,93,78,84,70,22],gorilla:['Gorilla','🦍',160,86,70,63,65,48],wolf:['Gray Wolf','🐺',45,62,48,82,92,92],hyena:['Hyena','🐕',60,68,56,72,88,88],cougar:['Cougar','🐆',70,72,55,91,74,18],wolverine:['Wolverine','🦡',15,47,63,72,90,20],boar:['Wild Boar','🐗',100,70,72,59,76,38],kangaroo:['Kangaroo','🦘',85,63,48,79,72,36],alligator:['Alligator','🐊',230,88,86,34,54,15],eagle:['Golden Eagle','🦅',5,30,20,98,74,35],raccoon:['Raccoon','🦝',9,24,28,82,68,55],cat:['House Cat','🐈',4.5,15,16,95,58,32],dog:['Medium Dog','🐕',25,44,38,76,76,70],goose:['Goose','🪿',5,18,19,75,60,72],rat:['Rat','🐀',.45,7,8,93,70,84]};const $=x=>document.getElementById(x),h=$('hero'),e=$('enemy');for(const k in A){h.add(new Option(A[k][1]+' '+A[k][0],k));e.add(new Option(A[k][1]+' '+A[k][0],k))}h.value='grizzly';e.value='cat';let t;const score=(a)=>a[3]*1.25+a[4]+a[5]*.45+a[6]*.55+Math.pow(a[2],.58)*8;function need(){let n=1,aa=A[h.value],bb=A[e.value],c=+$('coord').value/100;while(n<1000&&score(bb)*n*(.32+bb[7]/100*.42+c*.45)<score(aa)*1.15)n++;return n}function names(){$('hn').textContent=A[h.value][0];$('en').textContent=A[e.value][0]+' pack'}function reset(){clearInterval(t);$('arena').querySelectorAll('.sprite').forEach(x=>x.remove());$('hh').style.width='100%';$('eh').style.width='100%';$('comment').textContent='Choose a matchup and hit Fight.';names()}$('coord').oninput=()=>$('cv').textContent=$('coord').value+'%';$('chaos').oninput=()=>$('xv').textContent=$('chaos').value+'%';$('terrain').onchange=()=>$('arena').className='arena '+$('terrain').value;h.onchange=e.onchange=reset;$('estimate').onclick=()=>{$('title').textContent='About '+need()+' '+A[e.value][0]+'s';$('text').textContent='Estimated tipping point against one '+A[h.value][0]+' under the current settings.'};$('reset').onclick=reset;$('fight').onclick=()=>{reset();let aa=A[h.value],bb=A[e.value],n=Math.max(1,Math.min(1000,+$('count').value||1)),ar=$('arena'),W=ar.clientWidth,H=ar.clientHeight,hs=100,ps=100,q=0,ratio=(score(bb)*n*(.32+bb[7]/100*.42+(+$('coord').value/100)*.45))/(score(aa)*1.15),cha=+$('chaos').value/100;let hero=document.createElement('div');hero.className='sprite hero';hero.textContent=aa[1];hero.style.left=W*.14+'px';hero.style.top=H*.48+'px';ar.appendChild(hero);let mobs=[];for(let i=0;i<Math.min(n,36);i++){let s=document.createElement('div');s.className='sprite';s.textContent=bb[1];s.style.left=W*(.58+Math.random()*.3)+'px';s.style.top=H*(.25+Math.random()*.55)+'px';ar.appendChild(s);mobs.push(s)}$('title').textContent='Fight in progress…';$('text').textContent=aa[0]+' vs '+n+' '+bb[0]+'s';t=setInterval(()=>{q++;let r=()=>1+(Math.random()-.5)*2*cha;hs=Math.max(0,hs-Math.max(.3,2.1*ratio)*r());ps=Math.max(0,ps-Math.max(.4,2.7/Math.max(.25,ratio))*r());$('hh').style.width=hs+'%';$('eh').style.width=ps+'%';mobs.forEach((s,i)=>{let x=parseFloat(s.style.left),y=parseFloat(s.style.top),hx=parseFloat(hero.style.left),hy=parseFloat(hero.style.top);s.style.left=x+(hx-x)*.025+'px';s.style.top=y+(hy-y)*.025+'px';s.style.transform='rotate('+Math.sin(Date.now()/160+i)*9+'deg)'});hero.style.transform='translate('+Math.sin(Date.now()/200)*7+'px,'+Math.cos(Date.now()/260)*4+'px)';$('comment').textContent=[aa[0]+' charges!','The '+bb[0]+' pack closes in.','Stamina is starting to matter.','Coordination changes everything.'][q%4];if(hs<=0||ps<=0||q>120){clearInterval(t);let win=ps<=0||(q>120&&hs>ps);$('title').textContent=win?aa[1]+' '+aa[0]+' wins':bb[1]+' '+bb[0]+' pack wins';$('text').textContent='Estimated threshold: about '+need()+' '+bb[0]+'s. Rerun it for a different randomized outcome.'}},95)};names();reset();</script></body></html>
